        tracks: {glow: [{t: 0, v: 0.8}]}
        rotate: {base: [0.6, 0, 0], amp: [0.2, 0, 0.3], freq: [1, 0, 0.8], rate: [0, 0.5, 0]}     # taumelt um den Szenenursprung
