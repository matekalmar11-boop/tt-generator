    environment: {type: gradient, colors: {top: "#5f86c8", mid: "#ffb88a", bottom: "#ffe6c4"}}
    light:
      fog: {color: "#ffd9b8", near: 30, far: 150}
      hemi: {sky: "#ffe0c0", ground: "#9a7a6a", intensity: 1.1}
      ambient: 0.35
      key: {color: "#ffb070", intensity: 2.8, pos: [-22, 9, 14], shadowAt: [0, 0, -6]}
    actors:
      - {id: held, cast: held, at: [0, -0.1, -4], yaw: 0, pose: idle, face: worry, params: {gaze: "off", gestures: false, energy: 0.8}}
    objects:
      - {id: auto0, type: car, at: [-2.2, -0.02, -8.5], params: {yaw: 0.25, color: "#c94a4a", open: 1, lights: true}}
      - {id: auto1, type: car, at: [2.0, -0.02, -11.5], params: {yaw: -0.5, color: "#3f78d9", open: 0, lights: false}}
      - {id: auto2, type: car, at: [-2.6, -0.02, 2.2], params: {yaw: 2.9, color: "#e8c547", open: 0, lights: false}}
