# yaml-language-server: $schema=./story.schema.json
# „Der letzte Mensch“ – Mystery-TikTok (≈ 50 s, 1080×1920 @ 30 FPS). Ein Erzähler, eine Telefonstimme. Rig person2.
# Aussehen: Hauptfigur („du“) mit türkiser Kapuzenjacke; Doppelgänger identisch, nur Augen eine Spur zu hell, blinzelt nie.
schema: 1
meta: {id: der-letzte-mensch, title: Der letzte Mensch, genre: mystery, targetDuration: {min: 45, max: 56}}
format: {fps: 30, width: 1080, height: 1920}

voices:
  erzaehler:    # ruhig, etwas tiefer und langsamer: Spannung
    lengthScale: 1.18
    effect: {pitch: 0.94}
    loudness: -16
    subtitle: {accent: "#ffd23d"}
  anrufer:      # geflüstert wirkende, tiefe Telefonstimme mit Hall
    lengthScale: 1.3
    effect: {pitch: 0.8, lowpassHz: 2800, eq: {freqHz: 1500, gainDb: 3}, echo: {delayMs: 110, decay: 0.4}}
    loudness: -17
    subtitle: {accent: "#ff5a5a", label: "UNBEKANNTE STIMME"}

cast:
  erzaehler: {rig: person2, name: Erzähler, voice: erzaehler}      # nie im Bild
  anrufer: {rig: person2, name: Anrufer, voice: anrufer}           # nie im Bild
  held:
    rig: person2
    name: Du
    look: {skin: "#e8b894", hair: "#2b1d14", hairStyle: short, shirt: "#2fb5a8", pants: "#3b3f55", shoes: "#f2f2f2", eyes: "#3b6e8f"}
  doppel:   # sieht exakt aus wie die Hauptfigur (Augen eine Spur zu hell), spricht nie
    rig: person2
    name: Doppelgänger
    look: {skin: "#e8b894", hair: "#2b1d14", hairStyle: short, shirt: "#2fb5a8", pants: "#3b3f55", shoes: "#f2f2f2", eyes: "#e6ecff"}

audio:
  music: {file: music_mensch, volume: 0.30, duck: {depth: 0.16, attack: 6f, release: 14f}, fadeOut: 1f}
subtitles: {maxWords: 3, maxChars: 24, font: Inter, maxFontSize: 108, bottomPadding: 420}
overlays: {vignette: true}

scenes:
  - id: hook
    title: Hook – allein zwischen verlassenen Autos
    timing: {pre: 0.25, post: 1.0}
    set: {type: city_street, params: {building: "#c9a58f", road: "#4b4e5c", sidewalk: "#d8cfc0", accent: "#e0865a", windows: 0.45, lamps: false, trees: false, cars: false, seed: mensch}}
    environment: {type: gradient, colors: {top: "#5f86c8", mid: "#ffb88a", bottom: "#ffe6c4"}}
    light:
      fog: {color: "#ffd9b8", near: 30, far: 150}
      hemi: {sky: "#ffe0c0", ground: "#9a7a6a", intensity: 1.1}
      ambient: 0.35
      key: {color: "#ffb070", intensity: 2.8, pos: [-22, 9, 14], shadowAt: [0, 0, -6]}
    actors:
      - {id: held, cast: held, at: [0, -0.1, -4], yaw: 0, pose: idle, face: worry, params: {gaze: "off", gestures: false, energy: 0.5}}
    objects:
      - {id: auto0, type: car, at: [-2.2, -0.02, -8.5], params: {yaw: 0.25, color: "#c94a4a", open: 1, lights: true}}
      - {id: auto1, type: car, at: [2.0, -0.02, -11.5], params: {yaw: -0.5, color: "#3f78d9", open: 0, lights: false}}
      - {id: auto2, type: car, at: [-2.6, -0.02, 2.2], params: {yaw: 2.9, color: "#e8c547", open: 0, lights: false}}
      - {id: auto3, type: car, at: [3.0, -0.02, -3.0], params: {yaw: 0.35, color: "#2fb59a", open: 0, lights: false}}
      - {id: auto4, type: car, at: [-3.0, -0.02, -15.0], params: {yaw: -1.2, color: "#9a6ad9", open: 0, lights: false}}
      - {id: auto5, type: car, at: [0.4, -0.02, -19.0], params: {yaw: 3.3, color: "#eeeeee", open: 0, lights: true}}
      - {id: auto6, type: car, at: [-1.2, -0.02, -26.0], params: {yaw: 0.6, color: "#e07a3a", open: 1, lights: false}}
    camera:
      keys:
        - {t: 0, pos: [-1.6, 0.9, 7.5], look: [0, 2.4, -4], fov: 44}
        - {t: 2.3s, pos: [-0.9, 1.3, 3.8], look: [0, 2.5, -4], fov: 40, ease: out}
        - {t: 2.3s, pos: [0.9, 2.9, 1.4], look: [0, 2.6, -4], fov: 32, cut: true}
        - {t: 4.7s, pos: [0.5, 2.8, 0.6], look: [0, 2.6, -4], fov: 28, ease: lin}
        - {t: 4.7s, pos: [8, 15, 11], look: [0, 0.5, -9], fov: 50, cut: true}
        - {t: scene.end, pos: [5, 10, 8], look: [0, 0.5, -9], fov: 50, ease: io}
    lines:
      - {id: v01, who: erzaehler, text: "Stell dir vor, du wachst morgen auf, und alle Menschen sind verschwunden."}
      - {id: v02, who: erzaehler, text: "Kein einziger ist mehr da."}
    sfx:
      - {sound: wind, at: 0, loop: scene, volume: 0.4}
      - {sound: boom, at: 0.05, volume: 0.6}

