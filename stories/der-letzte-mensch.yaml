# yaml-language-server: $schema=./story.schema.json
# „Der letzte Mensch“ – Mystery-TikTok (≈ 50 s, 1080×1920 @ 30 FPS). Ein Erzähler, eine Telefonstimme. Rig person2.
# Aussehen: Hauptfigur („du“) mit türkiser Kapuzenjacke; Doppelgänger identisch, nur Augen eine Spur zu hell, blinzelt nie.
schema: 1
meta: {id: der-letzte-mensch, title: Der letzte Mensch, genre: mystery, targetDuration: {min: 45, max: 56}}
format: {fps: 30, width: 1080, height: 1920}

voices:
  erzaehler:    # ruhig, etwas tiefer und langsamer: Spannung
    lengthScale: 1.0
    effect: {pitch: 0.94}
    loudness: -16
    subtitle: {accent: "#ffd23d"}
  anrufer:      # geflüstert wirkende, tiefe Telefonstimme mit Hall
    lengthScale: 1.12
    effect: {pitch: 0.8, lowpassHz: 2800, eq: {freqHz: 1500, gainDb: 3}, echo: {delayMs: 110, decay: 0.4}}
    loudness: -17
    subtitle: {accent: "#ff5a5a", label: "UNBEKANNTE STIMME"}

cast:
  erzaehler: {rig: person2, name: Erzähler, voice: erzaehler}      # nie im Bild
  anrufer: {rig: person2, name: Anrufer, voice: anrufer}           # nie im Bild
  held:
    rig: person2
    name: Du
    look: {skin: "#e8b894", hair: "#2b1d14", hairStyle: short, shirt: "#2fb5a8", pants: "#3b3f55", shoes: "#f2f2f2", eyes: "#3b6e8f"}
  doppel:   # sieht exakt aus wie die Hauptfigur (Augen eine Spur zu hell), spricht nie
    rig: person2
    name: Doppelgänger
    look: {skin: "#e8b894", hair: "#2b1d14", hairStyle: short, shirt: "#2fb5a8", pants: "#3b3f55", shoes: "#f2f2f2", eyes: "#e6ecff"}

audio:
  music: {file: music_mensch, volume: 0.30, duck: {depth: 0.16, attack: 4f, release: 10f}, fadeOut: 1f}
subtitles: {maxWords: 3, maxChars: 24, font: Inter, maxFontSize: 108, bottomPadding: 420}
overlays: {vignette: true}

scenes:
