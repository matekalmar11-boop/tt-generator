# yaml-language-server: $schema=./story.schema.json
# „Die Nachricht von morgen“ – Mystery-TikTok, Teil 1 (≈ 30 s). Figuren: Rig person2.
# Ablauf: 1 Nachricht · 2 Foto von morgen + Datum-Vergleich · 3 Anruf (Ben sieht „Leon“ vor dem Haus) · 4 Foto 2 + Warnung · 5 letzte Nachricht, Türklinke, Schwarz.
# Foto-Szenen sind absichtlich starr und kalt (Foto-Rahmen mit Zeitstempel). Gesichter: frontal bis dreiviertel, keine Profile.
schema: 1
meta: {id: nachricht-von-morgen, title: Die Nachricht von morgen, genre: mystery, targetDuration: {min: 30, max: 36}}
format: {fps: 30, width: 1080, height: 1920}

voices:
  leon:     # Leon: etwas höher/jünger, direkt gesprochen
    lengthScale: 1.02
    effect: {pitch: 1.12}
    loudness: -16
    subtitle: {accent: "#ffd23d"}
  ben:      # Ben spricht durchs Telefon: tiefer, schmalbandig (Telefonklang)
    lengthScale: 1.04
    effect: {pitch: 0.97, lowpassHz: 3400, eq: {freqHz: 1800, gainDb: 4}}
    loudness: -17
    subtitle: {accent: "#7ff3ff", label: "BEN · AM TELEFON"}

cast:
  leon:
    rig: person2
    name: Leon
    voice: leon
    look: {skin: "#e8b894", hair: "#3b2a1e", hairStyle: short, shirt: "#3f6fb5", pants: "#2f3446", shoes: "#e8e8e8", eyes: "#3b6e8f"}
  ben:
    rig: person2
    name: Ben
    voice: ben
    look: {skin: "#d9a07a", hair: "#6a4a2a", hairStyle: short, shirt: "#d9534f", pants: "#3a3a3a", shoes: "#222222", hat: "#202020", eyes: "#3b6e8f"}
  doppel:   # sieht exakt aus wie Leon (nur die Augen sind eine Spur zu hell), spricht nie
    rig: person2
    name: Gestalt
    look: {skin: "#e8b894", hair: "#3b2a1e", hairStyle: short, shirt: "#3f6fb5", pants: "#2f3446", shoes: "#e8e8e8", eyes: "#e6ecff"}

audio:
  music: {file: music_mystery, volume: 0.42, duck: {depth: 0.3, attack: 6f, release: 12f}, fadeOut: 40f}
subtitles: {maxWords: 3, maxChars: 24, font: Inter, maxFontSize: 104, bottomPadding: 560}
overlays:
  seriesTag: {text: DIE NACHRICHT VON MORGEN, accent: "· TEIL 1", accentColor: "#ff5a5a"}
  vignette: true

scenes:
  # ═══════ 1 · NACHRICHT (Hook: Nachricht + Ping + Schock in den ersten Bildern) ═══════
  - id: nachricht
    title: Hook – Nachricht von meiner Nummer
    timing: {pre: 0.45, post: 1.0}
    set: {type: room, params: {wall: "#2a2f4a", floor: "#3a2c26", trim: "#4a4f6a", window: false, furniture: false}}
    light:
      fog: {color: "#14111c", near: 14, far: 60}
      hemi: {sky: "#8a7aa8", ground: "#2a1f2a", intensity: 0.55}
      key: {color: "#ffc78a", intensity: 1.3, pos: [-3, 9, 6], shadowAt: {rel: leon}}
    actors:
      - id: leon
        cast: leon
        at: [0, 0, 0]
        yaw: 0.08pi
        pose: idle
        prop: phone
        face: [{t: 0, face: neutral}, {t: 0.22s, face: shock, ease: cut}]
    objects:
      - {id: lamp, type: point_light, at: [-3, 4.5, 1], params: {color: "#ffb870", distance: 14}, tracks: {intensity: [{t: 0, v: 14}]}}
      - {id: glow, type: point_light, at: {rel: leon, off: [0.2, 2.6, 1.6]}, params: {color: "#8fd0ff", distance: 9}, tracks: {intensity: [{t: 0, v: 3}, {t: 0.2s, v: 8, ease: cut}, {t: 0.7s, v: 5, ease: out}]}}
    camera:
      shots: [{preset: push_in, target: {rel: leon, off: [0, 3.25, 0]}, offset: [0.5, 0.2, 5.4], push: 0.42, fov: [42, 33], ease: out, from: 0, to: scene.end}]
    lines:
      - {id: l01, who: leon, text: "Von meiner eigenen Nummer?"}
    captions:
      - {type: message, style: chat, from: 0, to: scene.end, sender: "Ich (meine Nummer)", text: "Geh morgen nicht zur Schule.", time: "19:42", status: Gerade eben}
    sfx:
      - {sound: ping, at: 0, volume: 0.9}
      - {sound: heartbeat, at: 0.5, volume: 0.28}

  # ═══════ 2a · FOTO VON MORGEN (starr, kalt, Foto-Rahmen) ═══════
  - id: foto1
    title: Foto – Leon schaut aufs Handy (von morgen)
    timing: {pre: 2.1, post: 0}
    set: {type: room, params: {wall: "#2a2f4a", floor: "#3a2c26", trim: "#4a4f6a", window: false, furniture: false}}
    light:
      fog: {color: "#101522", near: 14, far: 60}
      hemi: {sky: "#b8c8ff", ground: "#2a2f3a", intensity: 0.8}
      key: {color: "#dfe8ff", intensity: 1.0, pos: [2, 9, 6], shadowAt: {rel: leon}}
    actors:
      - {id: leon, cast: leon, at: [0, 0, 0], yaw: 0.08pi, pose: idle, prop: phone, face: worry, params: {energy: 0.4}}
    camera:
      keys: [{t: 0, pos: [0.9, 5.4, 5.2], look: [0, 2.9, 0], fov: 42}]
    captions:
      - {type: message, style: photo, from: 0, to: scene.end, sender: "FOTO VON „ICH“", time: "MITTWOCH · 08:17", flash: true}
    sfx:
      - {sound: ping, at: 0, volume: 0.8}
      - {sound: shutter, at: 0.06, volume: 0.9}

  # ═══════ 2b · DATUM VERGLEICHEN ═══════
  - id: datum
    title: Reaktion – Mittwoch? Heute ist Dienstag.
    timing: {pre: 0.35, post: 0.9}
    set: {type: room, params: {wall: "#2a2f4a", floor: "#3a2c26", trim: "#4a4f6a", window: false, furniture: false}}
    light:
      fog: {color: "#14111c", near: 14, far: 60}
      hemi: {sky: "#8a7aa8", ground: "#2a1f2a", intensity: 0.55}
      key: {color: "#ffc78a", intensity: 1.3, pos: [-3, 9, 6], shadowAt: {rel: leon}}
    actors:
      - id: leon
        cast: leon
        at: [0, 0, 0]
        yaw: -0.06pi
        pose: idle
        prop: phone
        face: [{t: 0, face: shock}, {t: "l03.start", face: worry, ease: cut}]
    objects:
      - {id: lamp, type: point_light, at: [-3, 4.5, 1], params: {color: "#ffb870", distance: 14}, tracks: {intensity: [{t: 0, v: 14}]}}
      - {id: glow, type: point_light, at: {rel: leon, off: [-0.2, 2.6, 1.6]}, params: {color: "#8fd0ff", distance: 9}, tracks: {intensity: [{t: 0, v: 5}]}}
    camera:
      shots: [{preset: handheld, target: {rel: leon, off: [0, 3.2, 0]}, offset: [0.4, 0.2, 5.0], to_offset: [0.2, 0.2, 4.2], fov: 36, amp: 0.05, from: 0, to: scene.end}]
    lines:
      - {id: l02, who: leon, text: "Mittwoch, acht Uhr siebzehn?"}
      - {id: l03, who: leon, text: "Heute ist erst Dienstag."}
    captions:
      - {type: message, style: lock, from: "l03.start-8f", to: scene.end, text: Dienstag, time: "19:42"}
    sfx:
      - {sound: riser, at: 0.3, volume: 0.18}

  # ═══════ 3a · ANRUF ═══════
  - id: anruf
    title: Anruf – Ben fragt nach dem Haus
    timing: {pre: 1.1, post: 0.5}
    set: {type: room, params: {wall: "#2a2f4a", floor: "#3a2c26", trim: "#4a4f6a", window: false, furniture: false}}
    light:
      fog: {color: "#14111c", near: 14, far: 60}
      hemi: {sky: "#8a7aa8", ground: "#2a1f2a", intensity: 0.55}
      key: {color: "#ffc78a", intensity: 1.3, pos: [-3, 9, 6], shadowAt: {rel: leon}}
    actors:
      - id: leon
        cast: leon
        at: [0, 0, 0]
        yaw: 0.06pi
        pose: [{t: 0, pose: idle}, {t: 0.9s, pose: idle}, {t: 1.25s, pose: call, ease: io}]
        prop: phone
        face: [{t: 0, face: worry}, {t: "l04.start", face: shock, ease: cut}]
    objects:
      - {id: lamp, type: point_light, at: [-3, 4.5, 1], params: {color: "#ffb870", distance: 14}, tracks: {intensity: [{t: 0, v: 14}]}}
      - {id: glow, type: point_light, at: {rel: leon, off: [0.2, 2.6, 1.6]}, params: {color: "#8fd0ff", distance: 9}, tracks: {intensity: [{t: 0, v: 4}, {t: 0.5s, v: 7, ease: cut}, {t: 0.9s, v: 4, ease: cut}, {t: 1.3s, v: 7, ease: cut}]}}
    camera:
      shots: [{preset: push_in, target: {rel: leon, off: [0, 3.2, 0]}, offset: [0.3, 0.2, 5.4], push: 0.35, fov: [36, 31], from: 0, to: scene.end}]
    lines:
      - {id: b01, who: ben, text: "Alter, was machst du vor deinem Haus?"}
      - {id: l04, who: leon, text: "Was? Ich bin zu Hause."}
    sfx:
      - {sound: ring, at: 0, volume: 0.7}

  # ═══════ 3b · BEN VOR DEM HAUS (Blickwinkel der Gestalt) ═══════
  - id: ben
    title: Ben auf der Straße – Subjektive der Gestalt
    timing: {pre: 0.25, post: 0.9}
    set: {type: city_street, params: {accent: "#e8c547", lamps: false}}      # ohne Laternenmasten: sie würden das Bild verdecken
    environment: {type: gradient, colors: {top: "#1b1442", mid: "#6a3d6e", bottom: "#2a1f4a"}}
    light:
      fog: {color: "#4a2f5e", near: 22, far: 100}
      hemi: {sky: "#c9a6ff", ground: "#3a2a4a", intensity: 0.85}
      key: {color: "#ffd2a0", intensity: 1.5, pos: [-6, 14, 10], shadowAt: {rel: ben}}
    actors:
      - {id: ben, cast: ben, at: [-5.4, 0, 0.5], yaw: 0.03pi, pose: call, prop: phone, face: [{t: 0, face: worry}, {t: "b02.word5", face: neutral, ease: cut}], params: {gaze: camera}}
    camera:
      shots: [{preset: handheld, target: {rel: ben, off: [0, 3.0, 0]}, offset: [1.0, 0.2, 8.0], to_offset: [0.5, 0.1, 5.6], fov: 34, amp: 0.07, from: 0, to: scene.end}]
    lines:
      - {id: b02, who: ben, text: "Du stehst genau vor mir. Und grinst."}
    sfx:
      - {sound: wind, at: 0, volume: 0.22, loop: scene}

  # ═══════ 3c · LEON (kurze Reaktion) ═══════
  - id: reaktion
    title: Leon erstarrt
    timing: {pre: 1.4, post: 0}
    set: {type: room, params: {wall: "#2a2f4a", floor: "#3a2c26", trim: "#4a4f6a", window: false, furniture: false}}
    light:
      fog: {color: "#14111c", near: 14, far: 60}
      hemi: {sky: "#8a7aa8", ground: "#2a1f2a", intensity: 0.5}
      key: {color: "#ffc78a", intensity: 1.2, pos: [-3, 9, 6], shadowAt: {rel: leon}}
    actors:
      - {id: leon, cast: leon, at: [0, 0, 0], yaw: -0.05pi, pose: call, prop: phone, face: shock}
    objects:
      - {id: lamp, type: point_light, at: [-3, 4.5, 1], params: {color: "#ffb870", distance: 14}, tracks: {intensity: [{t: 0, v: 12}]}}
      - {id: glow, type: point_light, at: {rel: leon, off: [0.2, 2.6, 1.6]}, params: {color: "#8fd0ff", distance: 9}, tracks: {intensity: [{t: 0, v: 5}]}}
    camera:
      shots: [{preset: push_in, target: {rel: leon, off: [0, 3.15, 0]}, offset: [0.2, 0.1, 5.0], push: 0.3, fov: [34, 30], from: 0, to: scene.end}]

  # ═══════ 4a · FOTO 2 (Jetzt: Ben und die Gestalt) ═══════
  - id: foto2
    title: Foto – Ben neben der Gestalt
    timing: {pre: 2.3, post: 0}
    set: {type: city_street, params: {accent: "#e8c547", lamps: false}}
    environment: {type: gradient, colors: {top: "#1b1442", mid: "#4a3d6e", bottom: "#2a1f4a"}}
    light:
      fog: {color: "#3a3a5e", near: 22, far: 100}
      hemi: {sky: "#b8c8ff", ground: "#3a3a4a", intensity: 0.8}
      key: {color: "#dfe8ff", intensity: 1.3, pos: [-6, 14, 10], shadowAt: [0, 0, 0]}
    actors:
      - {id: ben, cast: ben, at: [-5.1, 0, 0.4], yaw: 0.06pi, pose: call, prop: phone, face: worry, params: {gaze: camera, energy: 0.6}}
      - {id: doppel, cast: doppel, at: [-3.6, 0, 0.6], yaw: -0.04pi, pose: idle, face: smile, params: {gaze: camera, energy: 0, blink: false, gestures: false}}
    camera:
      keys: [{t: 0, pos: [-4.3, 3.4, 10.8], look: [-4.3, 2.5, 0.5], fov: 40}]
    captions:
      - {type: message, style: photo, from: 0, to: scene.end, sender: "FOTO VON „ICH“", time: "DIENSTAG · 19:44", flash: true}
    sfx:
      - {sound: ping, at: 0, volume: 0.8}
      - {sound: shutter, at: 0.06, volume: 0.9}
      - {sound: stinger, at: 0.1, volume: 0.4}

  # ═══════ 4b · WARNUNG ═══════
  - id: warnung
    title: Leon warnt Ben – Leitung bricht ab
    timing: {pre: 0.3, post: 1.0}
    set: {type: room, params: {wall: "#2a2f4a", floor: "#3a2c26", trim: "#4a4f6a", window: false, furniture: false}}
    light:
      fog: {color: "#14111c", near: 14, far: 60}
      hemi: {sky: "#8a7aa8", ground: "#2a1f2a", intensity: 0.5}
      key: {color: "#ffc78a", intensity: 1.2, pos: [-3, 9, 6], shadowAt: {rel: leon}}
    actors:
      - {id: leon, cast: leon, at: [0, 0, 0], yaw: 0.05pi, pose: call, prop: phone, face: [{t: 0, face: shock}, {t: "b03.start", face: worry, ease: cut}]}
    objects:
      - {id: lamp, type: point_light, at: [-3, 4.5, 1], params: {color: "#ffb870", distance: 14}, tracks: {intensity: [{t: 0, v: 12}]}}
      - {id: glow, type: point_light, at: {rel: leon, off: [0.2, 2.6, 1.6]}, params: {color: "#8fd0ff", distance: 9}, tracks: {intensity: [{t: 0, v: 5}]}}
    camera:
      shots: [{preset: handheld, target: {rel: leon, off: [0, 3.15, 0]}, offset: [0.3, 0.1, 4.6], to_offset: [0.1, 0.1, 3.6], fov: 32, amp: 0.09, speed: 2.2, from: 0, to: scene.end}]
    lines:
      - {id: l05, who: leon, text: "Ben, lauf weg!"}
      - {id: b03, who: ben, text: "Leon? Jetzt sag doch was!"}
    sfx:
      - {sound: beep_drop, at: "b03.end+4f", volume: 0.8}

  # ═══════ 5a · LETZTE NACHRICHT ═══════
  - id: letzte
    title: Letzte Nachricht – Das bin nicht ich.
    timing: {pre: 2.3, post: 0}
    set: {type: room, params: {wall: "#2a2f4a", floor: "#3a2c26", trim: "#4a4f6a", window: false, furniture: false}}
    light:
      fog: {color: "#0e0b14", near: 12, far: 50}
      hemi: {sky: "#6a6a98", ground: "#1a141c", intensity: 0.35}
      key: {color: "#ffc78a", intensity: 0.7, pos: [-3, 9, 6], shadowAt: {rel: leon}}
    actors:
      - {id: leon, cast: leon, at: [0, 0, 0], yaw: 0.04pi, pose: idle, prop: phone, face: [{t: 0, face: worry}, {t: 0.5s, face: shock, ease: cut}], params: {gaze: camera}}
    objects:
      - {id: glow, type: point_light, at: {rel: leon, off: [0, 2.6, 1.6]}, params: {color: "#8fd0ff", distance: 9}, tracks: {intensity: [{t: 0, v: 3}, {t: 0.3s, v: 9, ease: cut}, {t: 1.2s, v: 4, ease: out}]}}
    camera:
      shots: [{preset: push_in, target: {rel: leon, off: [0, 3.2, 0]}, offset: [0.2, 0.1, 5.0], push: 0.45, fov: [36, 28], from: 0, to: scene.end}]
    captions:
      - {type: message, style: chat, from: 0.3s, to: scene.end, sender: "Ich (meine Nummer)", text: "Das bin nicht ich.", time: "19:45", accent: "#d62839"}
    sfx:
      - {sound: heartbeat, at: 0, volume: 0.55}
      - {sound: ping, at: 0.3, volume: 0.9}
      - {sound: steps, at: 1.1, volume: 0.5}

  # ═══════ 5b · TÜRKLINKE ═══════
  - id: tuer
    title: Die Klinke bewegt sich
    timing: {pre: 2.2, post: 0}
    set: {type: room, params: {wall: "#2a2f4a", floor: "#3a2c26", trim: "#4a4f6a", window: false, furniture: false}}
    light:
      fog: {color: "#0a0810", near: 8, far: 30}
      hemi: {sky: "#4a4a70", ground: "#120e16", intensity: 0.28}
      key: {color: "#9fb4ff", intensity: 0.5, pos: [2, 8, 6], shadowAt: [0, 0, -3]}
    objects:
      - id: door
        type: door_handle
        at: [0, 0, -3.95]
        tracks:
          handle: [{t: 0, v: 0}, {t: 0.25s, v: 0}, {t: 1.75s, v: 0.95, ease: io}]
          light: [{t: 0, v: 0.25}, {t: 0.5s, v: 1, ease: out}]
    camera:
      keys:
        - {t: 0, pos: [1.9, 3.5, 0.2], look: [1.15, 3.3, -3.8], fov: 38}
        - {t: scene.end, pos: [1.5, 3.4, -1.6], look: [1.15, 3.3, -3.8], fov: 30, ease: io}
    sfx:
      - {sound: door_latch, at: 0.1, volume: 0.85}
      - {sound: boom, at: "scene.end-4f", volume: 0.8}

  # ═══════ 5c · SCHWARZ + ENDKARTE ═══════
  - id: ende
    title: Schwarz – Teil 2
    timing: {pre: 1.3, post: 0}
    set: {type: empty_stage}
    environment: {type: none}
    light:
      fog: {color: "#000000", near: 2, far: 10}
      hemi: {intensity: 0}
      ambient: 0
      key: {intensity: 0, pos: [0, 10, 5]}
    camera:
      keys: [{t: 0, pos: [0, 2, 8], look: [0, 60, 0], fov: 40}]
    captions:
      - {type: end_card, from: 0.1s, title: "TEIL 2", subtitle: "MITTWOCH · 08:17", glow: "#d62839", accent: "#ffffff"}
